<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Film grain pattern -->
    <pattern id="grain2" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.4" fill="#e8d5a3" opacity="0.07"/>
      <circle cx="4" cy="1" r="0.3" fill="#080808" opacity="0.05"/>
      <circle cx="2" cy="4" r="0.35" fill="#c8c3b8" opacity="0.06"/>
    </pattern>
    <pattern id="grain2b" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="1" r="0.4" fill="#080808" opacity="0.04"/>
      <circle cx="5" cy="4" r="0.3" fill="#e8d5a3" opacity="0.05"/>
      <circle cx="1" cy="5" r="0.35" fill="#080808" opacity="0.03"/>
    </pattern>
    <!-- Vignette -->
    <radialGradient id="vignette2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#080808" stop-opacity="0"/>
      <stop offset="65%" stop-color="#080808" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Warm overlay -->
    <linearGradient id="warmth2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4601a" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#e8d5a3" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#c4601a" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Neural glow -->
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Polaroid frame -->
  <rect x="0" y="0" width="800" height="450" rx="12" ry="12" fill="#1a1a18"/>

  <!-- Photo area -->
  <rect x="16" y="16" width="768" height="418" rx="6" ry="6" fill="#0e0d0b"/>
  <rect x="16" y="16" width="768" height="418" rx="6" ry="6" fill="url(#warmth2)"/>

  <!-- Neural network background - layer 1 (input) -->
  <g opacity="0.15" filter="url(#softglow)">
    <!-- Input layer nodes -->
    <circle cx="120" cy="100" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>
    <circle cx="120" cy="160" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>
    <circle cx="120" cy="220" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>
    <circle cx="120" cy="280" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>
    <circle cx="120" cy="340" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>

    <!-- Hidden layer 1 -->
    <circle cx="240" cy="130" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>
    <circle cx="240" cy="190" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>
    <circle cx="240" cy="250" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>
    <circle cx="240" cy="310" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>

    <!-- Connections input to hidden1 -->
    <line x1="126" y1="100" x2="234" y2="130" stroke="#e8d5a3" stroke-width="0.5" opacity="0.5"/>
    <line x1="126" y1="100" x2="234" y2="190" stroke="#e8d5a3" stroke-width="0.3" opacity="0.3"/>
    <line x1="126" y1="160" x2="234" y2="130" stroke="#e8d5a3" stroke-width="0.4" opacity="0.4"/>
    <line x1="126" y1="160" x2="234" y2="190" stroke="#e8d5a3" stroke-width="0.5" opacity="0.5"/>
    <line x1="126" y1="220" x2="234" y2="190" stroke="#e8d5a3" stroke-width="0.4" opacity="0.4"/>
    <line x1="126" y1="220" x2="234" y2="250" stroke="#e8d5a3" stroke-width="0.5" opacity="0.5"/>
    <line x1="126" y1="280" x2="234" y2="250" stroke="#e8d5a3" stroke-width="0.4" opacity="0.4"/>
    <line x1="126" y1="280" x2="234" y2="310" stroke="#e8d5a3" stroke-width="0.5" opacity="0.5"/>
    <line x1="126" y1="340" x2="234" y2="310" stroke="#e8d5a3" stroke-width="0.5" opacity="0.5"/>
    <line x1="126" y1="340" x2="234" y2="250" stroke="#e8d5a3" stroke-width="0.3" opacity="0.3"/>
  </g>

  <!-- Right side neural network (mirrored, faded) -->
  <g opacity="0.12">
    <!-- Output layer nodes -->
    <circle cx="680" cy="140" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>
    <circle cx="680" cy="220" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>
    <circle cx="680" cy="300" r="6" fill="none" stroke="#e8d5a3" stroke-width="1"/>

    <!-- Hidden layer right -->
    <circle cx="580" cy="120" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>
    <circle cx="580" cy="190" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>
    <circle cx="580" cy="260" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>
    <circle cx="580" cy="330" r="6" fill="none" stroke="#c8c3b8" stroke-width="1"/>

    <!-- Connections -->
    <line x1="586" y1="120" x2="674" y2="140" stroke="#e8d5a3" stroke-width="0.5" opacity="0.4"/>
    <line x1="586" y1="190" x2="674" y2="140" stroke="#e8d5a3" stroke-width="0.3" opacity="0.3"/>
    <line x1="586" y1="190" x2="674" y2="220" stroke="#e8d5a3" stroke-width="0.5" opacity="0.4"/>
    <line x1="586" y1="260" x2="674" y2="220" stroke="#e8d5a3" stroke-width="0.4" opacity="0.4"/>
    <line x1="586" y1="260" x2="674" y2="300" stroke="#e8d5a3" stroke-width="0.5" opacity="0.4"/>
    <line x1="586" y1="330" x2="674" y2="300" stroke="#e8d5a3" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Central AI Brain / Agent -->
  <g transform="translate(400, 210)" filter="url(#glow2)">
    <!-- Brain outline - stylized -->
    <ellipse cx="0" cy="0" rx="75" ry="65" fill="#c4601a" opacity="0.06"/>
    <ellipse cx="0" cy="0" rx="75" ry="65" fill="none" stroke="#e8d5a3" stroke-width="1.5" opacity="0.35"/>

    <!-- Brain folds/gyri -->
    <path d="M-50,-20 Q-30,-40 0,-35 Q30,-45 50,-20" fill="none" stroke="#e8d5a3" stroke-width="1" opacity="0.25"/>
    <path d="M-55,0 Q-25,-15 5,0 Q35,-10 55,5" fill="none" stroke="#e8d5a3" stroke-width="1" opacity="0.25"/>
    <path d="M-50,20 Q-20,10 0,25 Q25,15 50,25" fill="none" stroke="#e8d5a3" stroke-width="1" opacity="0.25"/>
    <path d="M-40,40 Q-15,30 10,42 Q30,35 45,40" fill="none" stroke="#c8c3b8" stroke-width="0.8" opacity="0.2"/>

    <!-- Neural activation points inside brain -->
    <circle cx="-30" cy="-15" r="3" fill="#c4601a" opacity="0.6"/>
    <circle cx="15" cy="-25" r="2.5" fill="#e8d5a3" opacity="0.5"/>
    <circle cx="35" cy="5" r="3" fill="#c4601a" opacity="0.5"/>
    <circle cx="-10" cy="15" r="2" fill="#e8d5a3" opacity="0.4"/>
    <circle cx="20" cy="30" r="2.5" fill="#c4601a" opacity="0.5"/>
    <circle cx="-40" cy="10" r="2" fill="#e8d5a3" opacity="0.35"/>
    <circle cx="0" cy="-5" r="4" fill="#c4601a" opacity="0.4"/>

    <!-- Internal connections -->
    <line x1="-30" y1="-15" x2="15" y2="-25" stroke="#e8d5a3" stroke-width="0.6" opacity="0.3"/>
    <line x1="15" y1="-25" x2="35" y2="5" stroke="#e8d5a3" stroke-width="0.6" opacity="0.3"/>
    <line x1="35" y1="5" x2="20" y2="30" stroke="#e8d5a3" stroke-width="0.6" opacity="0.3"/>
    <line x1="-30" y1="-15" x2="-10" y2="15" stroke="#e8d5a3" stroke-width="0.6" opacity="0.3"/>
    <line x1="-10" y1="15" x2="20" y2="30" stroke="#e8d5a3" stroke-width="0.6" opacity="0.3"/>
    <line x1="-40" y1="10" x2="-10" y2="15" stroke="#e8d5a3" stroke-width="0.6" opacity="0.3"/>
    <line x1="0" y1="-5" x2="-30" y2="-15" stroke="#c4601a" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="-5" x2="35" y2="5" stroke="#c4601a" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Agent connection lines from brain to networks -->
  <g opacity="0.18" stroke="#c4601a" stroke-width="1" fill="none" stroke-dasharray="4 3">
    <!-- Left connections -->
    <path d="M325,195 Q280,160 246,130"/>
    <path d="M325,210 Q280,200 246,190"/>
    <path d="M325,225 Q280,240 246,250"/>
    <path d="M325,240 Q280,280 246,310"/>
    <!-- Right connections -->
    <path d="M475,195 Q520,155 574,120"/>
    <path d="M475,210 Q520,195 574,190"/>
    <path d="M475,225 Q520,245 574,260"/>
    <path d="M475,240 Q520,290 574,330"/>
  </g>

  <!-- Autonomous agent icons - small robots/agents orbiting -->
  <!-- Agent 1 - top left -->
  <g transform="translate(280, 80)" opacity="0.35">
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="none" stroke="#e8d5a3" stroke-width="1.2"/>
    <circle cx="-4" cy="-1" r="2" fill="#c4601a"/>
    <circle cx="4" cy="-1" r="2" fill="#c4601a"/>
    <line x1="-6" y1="4" x2="6" y2="4" stroke="#e8d5a3" stroke-width="0.8"/>
    <line x1="0" y1="-8" x2="0" y2="-14" stroke="#e8d5a3" stroke-width="0.8"/>
    <circle cx="0" cy="-15" r="1.5" fill="#e8d5a3"/>
  </g>

  <!-- Agent 2 - top right -->
  <g transform="translate(520, 75)" opacity="0.3">
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="none" stroke="#e8d5a3" stroke-width="1.2"/>
    <circle cx="-4" cy="-1" r="2" fill="#c4601a"/>
    <circle cx="4" cy="-1" r="2" fill="#c4601a"/>
    <line x1="-6" y1="4" x2="6" y2="4" stroke="#e8d5a3" stroke-width="0.8"/>
    <line x1="0" y1="-8" x2="0" y2="-14" stroke="#e8d5a3" stroke-width="0.8"/>
    <circle cx="0" cy="-15" r="1.5" fill="#e8d5a3"/>
  </g>

  <!-- Agent 3 - bottom -->
  <g transform="translate(400, 360)" opacity="0.3">
    <rect x="-12" y="-9" width="24" height="18" rx="3" fill="none" stroke="#e8d5a3" stroke-width="1.2"/>
    <circle cx="-5" cy="-1" r="2.5" fill="#c4601a"/>
    <circle cx="5" cy="-1" r="2.5" fill="#c4601a"/>
    <line x1="-7" y1="5" x2="7" y2="5" stroke="#e8d5a3" stroke-width="0.8"/>
    <line x1="0" y1="-9" x2="0" y2="-16" stroke="#e8d5a3" stroke-width="0.8"/>
    <circle cx="0" cy="-17" r="1.5" fill="#e8d5a3"/>
  </g>

  <!-- On-chain blockchain blocks -->
  <g opacity="0.15">
    <!-- Block chain bottom left -->
    <rect x="60" y="370" width="22" height="22" rx="2" fill="none" stroke="#c4601a" stroke-width="1"/>
    <line x1="82" y1="381" x2="98" y2="381" stroke="#c4601a" stroke-width="0.8"/>
    <rect x="98" y="370" width="22" height="22" rx="2" fill="none" stroke="#c4601a" stroke-width="1"/>
    <line x1="120" y1="381" x2="136" y2="381" stroke="#c4601a" stroke-width="0.8"/>
    <rect x="136" y="370" width="22" height="22" rx="2" fill="none" stroke="#c4601a" stroke-width="1"/>

    <!-- Block chain top right -->
    <rect x="620" y="50" width="22" height="22" rx="2" fill="none" stroke="#c4601a" stroke-width="1"/>
    <line x1="642" y1="61" x2="658" y2="61" stroke="#c4601a" stroke-width="0.8"/>
    <rect x="658" y="50" width="22" height="22" rx="2" fill="none" stroke="#c4601a" stroke-width="1"/>
    <line x1="680" y1="61" x2="696" y2="61" stroke="#c4601a" stroke-width="0.8"/>
    <rect x="696" y="50" width="22" height="22" rx="2" fill="none" stroke="#c4601a" stroke-width="1"/>
  </g>

  <!-- Data flow particles -->
  <g fill="#e8d5a3" opacity="0.2">
    <circle cx="300" cy="150" r="1.5"/>
    <circle cx="310" cy="145" r="1"/>
    <circle cx="490" cy="155" r="1.5"/>
    <circle cx="505" cy="148" r="1"/>
    <circle cx="350" cy="320" r="1.5"/>
    <circle cx="450" cy="315" r="1"/>
    <circle cx="360" cy="100" r="1"/>
    <circle cx="440" cy="330" r="1.5"/>
  </g>

  <!-- Film grain -->
  <rect x="16" y="16" width="768" height="418" rx="6" ry="6" fill="url(#grain2)"/>
  <rect x="16" y="16" width="768" height="418" rx="6" ry="6" fill="url(#grain2b)"/>

  <!-- Vignette -->
  <rect x="16" y="16" width="768" height="418" rx="6" ry="6" fill="url(#vignette2)"/>

  <!-- Film border artifacts -->
  <line x1="18" y1="16" x2="18" y2="50" stroke="#c4601a" stroke-width="0.4" opacity="0.12"/>
  <line x1="782" y1="400" x2="782" y2="434" stroke="#e8d5a3" stroke-width="0.4" opacity="0.1"/>

  <!-- Date stamp -->
  <g transform="translate(650, 400)">
    <text fill="#c4601a" opacity="0.5" font-family="'Courier New', monospace" font-size="11" font-weight="bold">26  03  05</text>
  </g>

  <!-- Frame number -->
  <g transform="translate(40, 42)">
    <text fill="#e8d5a3" opacity="0.25" font-family="'Courier New', monospace" font-size="10">No. 02</text>
  </g>

  <!-- Film strip holes -->
  <g opacity="0.08" fill="#e8d5a3">
    <rect x="80" y="18" width="12" height="8" rx="1"/>
    <rect x="110" y="18" width="12" height="8" rx="1"/>
    <rect x="140" y="18" width="12" height="8" rx="1"/>
    <rect x="650" y="18" width="12" height="8" rx="1"/>
    <rect x="680" y="18" width="12" height="8" rx="1"/>
    <rect x="710" y="18" width="12" height="8" rx="1"/>
  </g>
</svg>